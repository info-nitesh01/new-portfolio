<body class="antialiased">

  <!-- Skip to Content -->
  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[100] focus:bg-accent-orange focus:text-white focus:px-4 focus:py-2 focus:rounded-lg">
    Skip to main content
  </a>

  <!-- ===== NAVBAR ===== -->
  <header id="navbar" class="fixed top-0 left-0 right-0 z-50 py-2 md:py-4 transition-all duration-300"></header>

  <!-- Page Loader -->
  <div id="page-loader" class="fixed inset-0 z-50 bg-surface flex items-center justify-center"></div>

  <main id="main-content">

    <!-- ===== HERO SECTION ===== -->
    <section class="min-h-screen flex flex-col items-center justify-center text-center px-4 sm:px-6 pt-20 md:pt-0 relative">
      <div class="max-w-4xl mx-auto">
        <!-- Overline -->
        <p id="hero-overline" class="font-mono text-xs sm:text-sm tracking-[0.3em] text-accent-cyan uppercase mb-6" data-aos="fade-down"></p>

        <!-- Name -->
        <h1 id="hero-name" class="font-display text-6xl sm:text-7xl md:text-8xl lg:text-9xl text-white uppercase leading-none tracking-tight mb-6" data-aos="fade-up" data-aos-delay="100"></h1>

        <!-- Typing Subtitle -->
        <div class="text-lg sm:text-xl md:text-2xl text-text-secondary mb-10 h-8" data-aos="fade-up" data-aos-delay="200">
          I'm a <span id="typing-text" class="text-white font-semibold typing-cursor"></span>
        </div>

        <!-- CTA Buttons -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4" data-aos="fade-up" data-aos-delay="300">
          <a href="projects.html" class="inline-flex items-center gap-2 px-8 py-3.5 rounded-xl font-semibold gradient-orange text-white hover:opacity-90 transition-opacity text-sm sm:text-base">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
            View Projects
          </a>
          <a href="#contact" class="inline-flex items-center gap-2 px-8 py-3.5 rounded-xl font-semibold border border-border text-white hover:border-accent-cyan hover:text-accent-cyan transition-all text-sm sm:text-base">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
            Contact Me
          </a>
        </div>
      </div>

      <!-- Scroll Indicator -->
      <div class="absolute bottom-8 left-1/2 -translate-x-1/2 scroll-indicator">
        <svg class="w-6 h-6 text-text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
        </svg>
      </div>
    </section>

    <!-- ===== BENTO INTRODUCTION ===== -->
    <section class="py-16 md:py-24 px-4 sm:px-6">
      <div class="max-w-6xl mx-auto">
        <div id="bento-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
          <!-- Dynamic content loaded from Supabase -->
        </div>
      </div>
    </section>

    <!-- ===== SKILLS PREVIEW ===== -->
    <section class="py-16 md:py-24 px-4 sm:px-6">
      <div class="max-w-6xl mx-auto">
        <!-- Section Header -->
        <div class="text-center mb-14" data-aos="fade-up">
          <p class="font-mono text-xs tracking-[0.3em] text-accent-cyan uppercase mb-3">Services</p>
          <h2 class="font-display text-4xl md:text-5xl lg:text-6xl text-white uppercase">What I Do</h2>
        </div>

        <!-- Skills Grid -->
        <div id="services-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
          <!-- Dynamic content loaded from Supabase -->
        </div>
      </div>
    </section>

    <!-- ===== FEATURED PROJECTS ===== -->
    <section class="py-16 md:py-24 px-4 sm:px-6">
      <div class="max-w-6xl mx-auto">
        <!-- Section Header -->
        <div class="flex flex-col sm:flex-row items-start sm:items-end justify-between mb-14 gap-4" data-aos="fade-up">
          <div>
            <p class="font-mono text-xs tracking-[0.3em] text-accent-cyan uppercase mb-3">Portfolio</p>
            <h2 class="font-display text-4xl md:text-5xl lg:text-6xl text-white uppercase">Selected Work</h2>
          </div>
          <a href="projects.html" class="inline-flex items-center gap-2 text-accent-orange hover:text-accent-orange-hover transition-colors font-medium text-sm">
            View all projects
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" /></svg>
          </a>
        </div>

        <!-- Projects Grid -->
        <div id="featured-projects-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Dynamic content loaded from Supabase -->
        </div>
      </div>
    </section>

    <!-- ===== CONTACT CTA ===== -->
    <section id="contact" class="py-16 md:py-24 px-4 sm:px-6">
      <div class="max-w-6xl mx-auto">
        <div class="bg-surface-card border border-border rounded-2xl p-10 md:p-16 text-center relative overflow-hidden" data-aos="fade-up">
          <!-- Background Accent -->
          <div class="absolute top-0 right-0 w-64 h-64 bg-accent-orange/5 rounded-full blur-3xl"></div>
          <div class="absolute bottom-0 left-0 w-64 h-64 bg-accent-cyan/5 rounded-full blur-3xl"></div>

          <div class="relative z-10">
            <p class="font-mono text-xs tracking-[0.3em] text-accent-cyan uppercase mb-4">Get In Touch</p>
            <h2 class="font-display text-4xl sm:text-5xl md:text-6xl lg:text-7xl text-white uppercase mb-6">Let's Work<br>Together</h2>
            <p class="text-text-secondary max-w-xl mx-auto mb-8 leading-relaxed">
              Have a project in mind or want to collaborate? I'm always open to discussing new opportunities and creative ideas.
            </p>

            <a id="contact-email" href="#" class="inline-flex items-center gap-2 text-xl sm:text-2xl text-accent-orange hover:text-accent-orange-hover transition-colors font-semibold mb-8"></a>

            <!-- Social Links -->
            <div id="contact-social" class="flex items-center justify-center gap-4 mt-6">
              <!-- Dynamic content loaded from Supabase -->
            </div>
          </div>
        </div>
