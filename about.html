<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <meta name="description" content="" />

  <!-- Open Graph -->
  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <meta property="og:type" content="website" />

  <!-- Cached site title -->
  <script>
  (function(){try{var m=JSON.parse(localStorage.getItem('siteMeta'));if(m&&m.title)document.title=m.title}catch(e){}})();
  </script>

  <!-- Preconnect hints -->
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://idvqbntofuaxryuyeqmt.supabase.co" />

  <!-- Tailwind (pre-compiled) -->
  <link rel="stylesheet" href="css/tailwind-output.css" />

  <!-- Google Fonts (non-blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" /></noscript>

  <!-- AOS (non-blocking) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet" media="print" onload="this.media='all'" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="antialiased">

  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[100] focus:bg-accent-orange focus:text-white focus:px-4 focus:py-2 focus:rounded-lg">Skip to main content</a>

  <!-- ===== NAVBAR ===== -->
  <header id="navbar" class="fixed top-0 left-0 right-0 z-50 py-2 md:py-4 transition-all duration-300"></header>

  <!-- Page Loader -->
  <div id="page-loader" class="fixed inset-0 z-50 bg-surface flex items-center justify-center"></div>

  <main id="main-content" class="pt-20 md:pt-28">

    <!-- ===== PAGE HEADER ===== -->
    <section class="py-12 md:py-20 px-4 sm:px-6">
      <div class="max-w-6xl mx-auto text-center">
        <p class="font-mono text-xs tracking-[0.3em] text-accent-cyan uppercase mb-3" data-aos="fade-down">Get to know me</p>
        <h1 class="font-display text-5xl sm:text-6xl md:text-7xl lg:text-8xl text-white uppercase" data-aos="fade-up">About Me</h1>
      </div>
    </section>

    <!-- ===== ABOUT ME ===== -->
    <section class="py-12 md:py-20 px-4 sm:px-6">
      <div class="max-w-6xl mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16 items-center">

          <!-- Text -->
          <div data-aos="fade-right">
            <div id="about-bio"></div>
          </div>

          <!-- Photo -->
          <div id="about-photo" class="relative" data-aos="fade-left">
            <div class="bg-surface-card border border-border rounded-2xl overflow-hidden aspect-[4/5] relative">
              <div class="absolute inset-0 bg-gradient-to-br from-accent-orange/10 to-accent-cyan/10 flex items-center justify-center">
                <div class="text-center">
                  <svg class="w-24 h-24 text-text-muted/30 mx-auto mb-4" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                  </svg>
                  <p class="text-text-muted text-sm">Your Photo Here</p>
                </div>
              </div>
            </div>
            <!-- Decorative elements -->
            <div class="absolute -bottom-4 -right-4 w-24 h-24 border-2 border-accent-orange/20 rounded-2xl -z-10"></div>
            <div class="absolute -top-4 -left-4 w-16 h-16 border-2 border-accent-cyan/20 rounded-2xl -z-10"></div>
          </div>

        </div>
      </div>
    </section>

    <!-- ===== PROFESSIONAL SKILLS ===== -->
    <section class="py-16 md:py-24 px-4 sm:px-6">
      <div class="max-w-6xl mx-auto">
        <!-- Section Header -->
        <div class="text-center mb-14" data-aos="fade-up">
          <p class="font-mono text-xs tracking-[0.3em] text-accent-cyan uppercase mb-3">Expertise</p>
          <h2 class="font-display text-4xl md:text-5xl lg:text-6xl text-white uppercase">Professional Skills</h2>
        </div>

        <!-- Skills Grid -->
        <div id="about-skills-grid" class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-6">
        </div>
      </div>
    </section>

    <!-- ===== TOOLS & TECHNOLOGIES ===== -->
    <section class="py-16 md:py-24 px-4 sm:px-6">
      <div class="max-w-6xl mx-auto">
        <!-- Section Header -->
        <div class="text-center mb-14" data-aos="fade-up">
          <p class="font-mono text-xs tracking-[0.3em] text-accent-cyan uppercase mb-3">Tech Stack</p>
          <h2 class="font-display text-4xl md:text-5xl lg:text-6xl text-white uppercase">Tools I Use</h2>
        </div>

        <div id="tools-container"></div>

      </div>
    </section>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer id="site-footer" class="border-t border-border mt-8"></footer>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="js/supabase-config.js"></script>
  <script defer src="js/supabase-data.js"></script>
  <script defer src="js/main.js"></script>
  <script>
document.addEventListener('DOMContentLoaded', async () => {
  showSkeleton('about-skills-grid');
  showSkeleton('tools-container');

  const [profile, skills, tools, socialLinks, pageMeta] = await Promise.all([
    fetchProfile(),
    fetchSkills('about'),
    fetchTools(),
    fetchSocialLinks(),
    fetchSiteMetadata()
  ]);

  // Apply page metadata before rendering
  applySiteMetadata(pageMeta);

  // Render About Bio
  if (profile) {
    renderAboutBio(profile);
    renderAboutPhoto(profile);
    renderNavbar(profile);
  }

  // Render Skills
  if (skills && skills.length > 0) {
    renderAboutSkills(skills);
  }
  hideSkeleton('about-skills-grid');

  // Render Tools
  if (tools && tools.length > 0) {
    renderAboutTools(tools);
  }
  hideSkeleton('tools-container');

  // Render Footer
  renderFooter(profile, socialLinks);

  // Re-initialize
  if (typeof AOS !== 'undefined') AOS.refresh();
  initSkillBarAnimations();

  hidePageLoader();
});

function renderAboutBio(profile) {
  const container = document.getElementById('about-bio');
  if (!container) return;

  const paragraphs = profile.bio_paragraphs || [];
  container.innerHTML = `
    <p class="font-mono text-xs tracking-[0.2em] text-accent-orange uppercase mb-4">Who I Am</p>
    <h2 class="font-display text-3xl md:text-4xl text-white uppercase mb-6">${profile.about_heading || 'Passionate About Creating Impactful Digital Experiences'}</h2>
    <div class="space-y-4 text-text-secondary leading-relaxed">
      ${paragraphs.map(p => `<p>${p}</p>`).join('')}
    </div>
    <div class="grid grid-cols-2 gap-4 mt-8">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full bg-accent-orange flex-shrink-0"></span>
        <span class="text-sm text-text-secondary"><strong class="text-white">Name:</strong> ${profile.full_name}</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full bg-accent-orange flex-shrink-0"></span>
        <span class="text-sm text-text-secondary"><strong class="text-white">Location:</strong> ${profile.location_city}</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full bg-accent-orange flex-shrink-0"></span>
        <span class="text-sm text-text-secondary"><strong class="text-white">Experience:</strong> ${profile.years_experience}+ Years</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full bg-accent-orange flex-shrink-0"></span>
        <span class="text-sm text-text-secondary"><strong class="text-white">Availability:</strong> ${profile.availability_open ? 'Freelance' : 'Not Available'}</span>
      </div>
    </div>
  `;
}

function renderAboutPhoto(profile) {
  const container = document.getElementById('about-photo');
  if (!container) return;

  if (profile.profile_image_url) {
    container.innerHTML = `
      <div class="bg-surface-card border border-border rounded-2xl overflow-hidden aspect-[4/5] relative">
        <img src="${profile.profile_image_url}" alt="${profile.full_name}" class="w-full h-full object-cover" />
      </div>
      <div class="absolute -bottom-4 -right-4 w-24 h-24 border-2 border-accent-orange/20 rounded-2xl -z-10"></div>
      <div class="absolute -top-4 -left-4 w-16 h-16 border-2 border-accent-cyan/20 rounded-2xl -z-10"></div>
    `;
  }
  // If no image, keep the existing placeholder HTML
}

function renderAboutSkills(skills) {
  const container = document.getElementById('about-skills-grid');
  if (!container) return;

  container.innerHTML = skills.map((skill, i) => `
    <div class="bg-surface-card border border-border rounded-2xl p-6 card-hover" data-aos="fade-up" data-aos-delay="${i * 50}">
      <div class="flex justify-between items-center mb-3">
        <span class="font-semibold text-white">${skill.name}</span>
        <span class="text-accent-cyan font-mono text-sm">${skill.percentage}%</span>
      </div>
      <div class="w-full h-2.5 bg-surface-hover rounded-full overflow-hidden">
        <div class="skill-bar-fill h-full rounded-full ${skill.gradient_class || 'gradient-orange'}" style="--target-width: ${skill.percentage}%"></div>
      </div>
    </div>
  `).join('');
}

function renderAboutTools(tools) {
  const container = document.getElementById('tools-container');
  if (!container) return;

  // Group tools by category
  const grouped = {};
  tools.forEach(tool => {
    if (!grouped[tool.category]) grouped[tool.category] = [];
    grouped[tool.category].push(tool);
  });

  container.innerHTML = Object.entries(grouped).map(([category, items]) => `
    <div class="mb-10">
      <h3 class="font-mono text-xs tracking-[0.2em] text-accent-orange uppercase mb-5 pl-1" data-aos="fade-up">${category}</h3>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
        ${items.map((tool, i) => `
          <div class="bg-surface-card border border-border rounded-xl p-5 flex flex-col items-center gap-3 card-hover group" data-aos="fade-up" data-aos-delay="${i * 50}">
            <svg class="w-10 h-10 text-[${tool.icon_color || '#FFFFFF'}] group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="currentColor">${tool.icon_svg || ''}</svg>
            <span class="text-xs font-medium text-text-secondary">${tool.name}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}
</script>
</body>
</html>
