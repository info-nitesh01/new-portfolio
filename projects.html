<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <meta name="description" content="" />

  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <meta property="og:type" content="website" />

  <!-- Cached site title -->
  <script>
  (function(){try{var m=JSON.parse(localStorage.getItem('siteMeta'));if(m&&m.title)document.title=m.title}catch(e){}})();
  </script>

  <!-- Preconnect hints -->
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://idvqbntofuaxryuyeqmt.supabase.co" />

  <!-- Tailwind (pre-compiled) -->
  <link rel="stylesheet" href="css/tailwind-output.css" />

  <!-- Google Fonts (non-blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" /></noscript>

  <!-- AOS (non-blocking) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet" media="print" onload="this.media='all'" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="antialiased">

  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[100] focus:bg-accent-orange focus:text-white focus:px-4 focus:py-2 focus:rounded-lg">Skip to main content</a>

  <!-- ===== NAVBAR ===== -->
  <header id="navbar" class="fixed top-0 left-0 right-0 z-50 py-2 md:py-4 transition-all duration-300"></header>

  <!-- Page Loader -->
  <div id="page-loader" class="fixed inset-0 z-50 bg-surface flex items-center justify-center"></div>

  <main id="main-content" class="pt-20 md:pt-28">

    <!-- ===== PAGE HEADER ===== -->
    <section class="py-12 md:py-20 px-4 sm:px-6">
      <div class="max-w-6xl mx-auto text-center">
        <p class="font-mono text-xs tracking-[0.3em] text-accent-cyan uppercase mb-3" data-aos="fade-down">Portfolio</p>
        <h1 class="font-display text-5xl sm:text-6xl md:text-7xl lg:text-8xl text-white uppercase" data-aos="fade-up">My Projects</h1>
      </div>
    </section>

    <!-- ===== MY RECENT WORK ===== -->
    <section class="py-12 md:py-20 px-4 sm:px-6">
      <div class="max-w-6xl mx-auto">
        <!-- Section Header + Filter -->
        <div class="flex flex-col sm:flex-row items-start sm:items-end justify-between mb-10 gap-6" data-aos="fade-up">
          <div>
            <p class="font-mono text-xs tracking-[0.2em] text-accent-orange uppercase mb-3">Professional</p>
            <h2 class="font-display text-3xl md:text-4xl lg:text-5xl text-white uppercase">My Recent Work</h2>
          </div>
          <!-- Filter Buttons -->
          <div class="flex flex-wrap gap-2">
            <button data-filter="all" class="filter-btn active px-4 py-2 rounded-full text-sm font-medium border border-border text-text-secondary hover:text-white transition-all">All</button>
            <button data-filter="frontend" class="filter-btn px-4 py-2 rounded-full text-sm font-medium border border-border text-text-secondary hover:text-white transition-all">Frontend</button>
            <button data-filter="fullstack" class="filter-btn px-4 py-2 rounded-full text-sm font-medium border border-border text-text-secondary hover:text-white transition-all">Full Stack</button>
            <button data-filter="react" class="filter-btn px-4 py-2 rounded-full text-sm font-medium border border-border text-text-secondary hover:text-white transition-all">React / Next.js</button>
          </div>
        </div>

        <!-- Projects Grid -->
        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>
      </div>
    </section>

    <!-- ===== PRACTICE WORK ===== -->
    <section class="py-12 md:py-20 px-4 sm:px-6">
      <div class="max-w-6xl mx-auto">
        <!-- Section Header -->
        <div class="mb-10" data-aos="fade-up">
          <p class="font-mono text-xs tracking-[0.2em] text-accent-cyan uppercase mb-3">Learning & Growth</p>
          <h2 class="font-display text-3xl md:text-4xl lg:text-5xl text-white uppercase">My Recent Practice Work</h2>
          <p class="text-text-secondary mt-3 max-w-2xl">Personal projects and experiments that help me explore new technologies and sharpen my skills.</p>
        </div>

        <!-- Practice Projects Grid -->
        <div id="practice-projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>
      </div>
    </section>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer id="site-footer" class="border-t border-border mt-8"></footer>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="js/supabase-config.js"></script>
  <script defer src="js/supabase-data.js"></script>
  <script defer src="js/main.js"></script>
  <script defer src="js/pages/projects.js"></script>

</body>
</html>
